# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = xrdb ~/.Xresources
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = systemctl --user start hyprpolkitagent
exec-once = flclash &
exec-once = qs -c noctalia-shell & # noctalia-shell
exec-once = sleep 1 && $terminal
exec-once = nm-applet &
exec-once = fcitx5 &
exec-once = wl-paste --type text --watch cliphist store && wl-paste --type image --watch cliphist store &
exec-once = copyq &
exec-once = blueman-applet &
exec-once = hypridle &
exec-once = sleep 5 && rclone mount remote: ~/OneDrive --vfs-cache-mode full &
exec-once = ~/.config/hypr/scripts/switch_display.sh

