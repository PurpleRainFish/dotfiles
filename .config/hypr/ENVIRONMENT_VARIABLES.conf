# See https://wiki.hypr.land/Configuring/Environment-variables/

# Qt
env = QT_AUTO_SCREEN_SCALE_FACTOR,1 # enables automatic scaling, based on the monitor’s pixel density
env = QT_QPA_PLATFORM,wayland;xcb # Tell Qt applications to use the Wayland backend, and fall back to X11 if Wayland is unavailable
env = QT_QPA_PLATFORMTHEME,qt6ct

# GTK
env = GDK_BACKEND,wayland,x11,* # GTK: Use Wayland if available; if not, try X11 and then any other GDK backend.

# cursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,catppuccin-macchiato-mauve-cursors

# nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# electron
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# language
env = LANG,zh_CN.UTF-8

# editor
env = EDITOR,nvim

# 输入法
env = XMODIFIERS,@im=fcitx

# dolphin
env = XDG_MENU_PREFIX,arch-
